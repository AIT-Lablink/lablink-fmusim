services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ../config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # A Windows bind mount is world-writable, which Mosquitto 2 refuses to load.
    # The copy script has to be a single argument. A plain string is split, and sh -c then runs cp with no arguments.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cp /mosquitto/config/mosquitto.conf /tmp/mosquitto.conf && chmod 600 /tmp/mosquitto.conf && exec /usr/sbin/mosquitto -c /tmp/mosquitto.conf"
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  lablink-config:
    image: ait1/lablink-config-server:latest
    volumes:
      - ../config/test-config.db:/app/config.db
    ports:
      - "10101:10101"

  dpb:
    image: ait1/lablink-datapoint-bridge:latest
    environment:
      LLCONFIG: http://lablink-config:10101/get?id=
      DPB_CONFIG: ait.test.fmusim.dpb.config
      LOGGER_ID: ait.all.all.log4j2
    depends_on:
      mqtt:
        condition: service_healthy
      lablink-config:
        condition: service_started

  plotter:
    image: ait1/lablink-plotter:latest
    environment:
      LLCONFIG: http://lablink-config:10101/get?id=
      PLOT_CLASS: at.ac.ait.lablink.clients.plotter.PlotterAsync
      PLOT_CONFIG: ait.test.fmusim.plotter.config
      LOGGER_ID: ait.all.all.log4j2
      MEMORY_FLAG: -Xmx1024m
    ports:
      - "8080:8080"
    depends_on:
      mqtt:
        condition: service_healthy
      lablink-config:
        condition: service_started

  # The client opens an FMU archive. The Linux zigzag model is unpacked, so pack
  # it before the simulator starts. The configuration URI is file:///tmp/zigzag.fmu.
  fmusim:
    image: ait1/lablink-fmusim:latest
    profiles: ["shell"]
    stdin_open: true
    tty: true
    volumes:
      - ../../src/test/resources/zigzag-linux64:/opt/zigzag:ro
    environment:
      LLCONFIG: http://lablink-config:10101/get?id=
      FMUSIM_CONFIG: ait.test.fmusim.fixedstep_me.fmu.config
      FMUSIM_CLASS: at.ac.ait.lablink.clients.fmusim.FixedStepFmuModelExchangeAsync
      LOGGER_ID: ait.all.all.log4j2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "jar cfM /tmp/zigzag.fmu -C /opt/zigzag . && exec /entrypoint.sh"
    depends_on:
      mqtt:
        condition: service_healthy
      lablink-config:
        condition: service_started
